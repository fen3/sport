name: Build executables

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_linux:
    name: ${{ matrix.artifact_name }}
    runs-on: ${{ matrix.os }}
    container:
      # rust:1-slim-focal = Ubuntu 20.04 (GLIBC 2.31) + preinstalled Rust stable + curl
      image: rust:1-slim-focal
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact_name: countdown-linux-x86_64
            binary_path: countdown/target/release/countdown
          - os: ubuntu-24.04-arm
            artifact_name: countdown-linux-arm64
            binary_path: countdown/target/release/countdown

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Rust toolchain
        run: rustc --version && cargo --version

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: countdown

      - name: Install Linux graphics dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Build release executable
        working-directory: countdown
        run: cargo build --release --locked

      - name: Prepare uniquely named asset
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.binary_path }}" "dist/${{ matrix.artifact_name }}"

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*
          if-no-files-found: error

  build_other:
    name: ${{ matrix.artifact_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: countdown-windows-x86_64
            binary_path: countdown/target/release/countdown.exe
          - os: macos-latest
            artifact_name: countdown-macos
            binary_path: countdown/target/release/countdown

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: countdown

      - name: Build release executable
        working-directory: countdown
        run: cargo build --release --locked

      - name: Prepare uniquely named asset
        shell: bash
        run: |
          mkdir -p dist
          ext=""
          if [ "${{ runner.os }}" = "Windows" ]; then ext=".exe"; fi
          cp "${{ matrix.binary_path }}" "dist/${{ matrix.artifact_name }}${ext}"

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build_linux, build_other]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all executables
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/**/*
